<!DOCTYPE html>
<!--
html 交付模板 · 遵循 delivery-standard §2 三段式（口径块 → 内联引用 → Reference）与反方≥5
用法：由 references/skills/research-html/render_html.py 读取报告数据(JSON) 后填充占位符生成。
      口径行 / 章节 / 反方 / 引用 四类占位符由渲染器拼装，其余为静态骨架。
      自包含、无 CDN、可离线打开、可打印/导出 PDF。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PID}} · {{THEME}}（{{DATE}}）— 主交付</title>
<style>
  :root{
    --paper:#fbfaf8; --card:#ffffff; --ink:#1f2024; --muted:#6c6f76;
    --line:#e7e3da; --accent:#0f5e57; --accent-soft:#e8f1ef;
    --up:#d8382e; --down:#1f9d55; --warn:#b5462f;
    --serif:"Noto Serif SC","Songti SC","STSong",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    line-height:1.75;font-size:15px;display:flex;justify-content:center;padding:40px 16px 72px;}
  .doc{width:100%;max-width:860px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 1px 2px rgba(31,32,36,.04),0 12px 40px rgba(31,32,36,.06);
    padding:48px 52px 56px;}
  /* 顶部强调条 */
  .doc::before{content:"";display:block;height:4px;margin:-48px -52px 36px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent-soft) 60%,transparent 100%);
    border-radius:10px 10px 0 0;}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:10px;}
  h1{font-family:var(--serif);font-size:30px;line-height:1.3;margin:0 0 6px;font-weight:700;letter-spacing:.01em;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:6px;}
  .meta{color:var(--muted);font-size:13px;margin-bottom:28px;}
  .rule{height:1px;background:var(--line);border:0;margin:0 0 28px;}

  /* 口径块 */
  .caliber{background:var(--accent-soft);border:1px solid #d4e6e2;border-radius:8px;
    padding:18px 22px;margin:0 0 34px;}
  .caliber h2{font-family:var(--serif);font-size:17px;margin:0 0 12px;color:var(--accent);}
  table.cal{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.cal th{text-align:left;color:var(--muted);font-weight:600;width:34%;
    padding:6px 14px 6px 0;vertical-align:top;border-bottom:1px dashed #cfe0dc;}
  table.cal td{padding:6px 0;border-bottom:1px dashed #cfe0dc;vertical-align:top;}
  table.cal tr:last-child th,table.cal tr:last-child td{border-bottom:0;}

  /* 章节 */
  section{margin:0 0 30px;}
  section h2{font-family:var(--serif);font-size:21px;margin:0 0 12px;padding-left:13px;
    border-left:4px solid var(--accent);line-height:1.4;}
  section p{margin:0 0 12px;}
  .src{color:var(--muted);font-style:italic;font-size:12.5px;}
  .src::before{content:"　源：";font-style:normal;}
  .up{color:var(--up);font-weight:600;}
  .down{color:var(--down);font-weight:600;}
  strong{font-weight:700;}

  /* 反方论点 */
  .counter{margin:0 0 30px;}
  .counter h2{font-family:var(--serif);font-size:21px;margin:0 0 14px;padding-left:13px;
    border-left:4px solid var(--warn);}
  ol.cv{list-style:none;counter-reset:cv;margin:0;padding:0;}
  ol.cv li{counter-increment:cv;position:relative;background:#fcfbf9;border:1px solid var(--line);
    border-left:3px solid var(--warn);border-radius:6px;padding:11px 16px 11px 46px;margin-bottom:10px;
    font-size:14px;}
  ol.cv li::before{content:counter(cv);position:absolute;left:14px;top:11px;width:22px;height:22px;
    background:var(--warn);color:#fff;border-radius:50%;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;}

  /* Reference */
  .ref h2{font-family:var(--serif);font-size:18px;margin:0 0 10px;color:var(--muted);}
  ul.ref{list-style:none;margin:0;padding:0;}
  ul.ref li{position:relative;padding-left:18px;color:var(--muted);font-size:13px;margin-bottom:6px;}
  ul.ref li::before{content:"›";position:absolute;left:2px;color:var(--accent);font-weight:700;}

  footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px;text-align:center;}

  @media (max-width:600px){ .doc{padding:32px 22px 40px;} .doc::before{margin:-32px -22px 28px;} h1{font-size:25px;} }
  @media print{
    body{background:#fff;padding:0;}
    .doc{box-shadow:none;border:0;max-width:none;padding:0;}
    .doc::before{display:none;}
    section,.counter,ol.cv li{break-inside:avoid;}
    a{color:var(--ink);text-decoration:none;}
  }
</style>
</head>
<body>
  <article class="doc">
    <div class="kicker">RESEARCH KIT · 主交付</div>
    <h1>{{THEME}}</h1>
    <div class="sub">{{PID}} · 调研主交付</div>
    <div class="meta">日期：{{DATE}} ｜ 载体：自包含 HTML 报告（本地 SSOT 不反向写）</div>
    <hr class="rule">

    <div class="caliber">
      <h2>口径块（Caliber）</h2>
      <table class="cal">
        {{CALIBER_ROWS}}
      </table>
    </div>

    {{SECTIONS}}

    <div class="counter">
      <h2>反方论点（≥5 条，含 ≥1 条时间维度）</h2>
      <ol class="cv">
        {{COUNTER_ITEMS}}
      </ol>
    </div>

    <div class="ref">
      <h2>Reference</h2>
      <ul class="ref">
        {{REFERENCE_ITEMS}}
      </ul>
    </div>

    <footer>由 research-kit · research-html（合并自 frontend-design）渲染 · 本地 SSOT 为权威来源</footer>
  </article>
</body>
</html>

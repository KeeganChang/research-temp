# research-state.yaml —— Research Assistant 套件 · 项目状态机模板（SSOT）
#
# ⚠️ 状态机自 2026-11-02 起降级为「可选复用层」（见证据链精简方案 v1.1 §3.4）：
#   一次性 / 轻量任务可不写本文件；仅月频重跑 / 跨会话续做 / 多人协作才启用。
#   准确性保障由「报告内联引用 + 口径块 + 反方≥5」承担，不再依赖本文件。
#
# 本模板与 load_context.py / new_project.py 的解析 schema 严格对齐，
# 套件克隆后可直接被脚本读取（自洽可跑）。字段名不可随意改动，
# 改动须同步 script/load_context.py 的渲染逻辑。
#
# 解决的问题：调研结论散落在 md 正文里，下次会话读不到、要重做。
# 设计原则：
#   1. 只存「可执行的沉淀」——结论(claims)、监控(monitors)、待办(queue)、已归档数据(datasets)，不抄正文。
#   2. 每条结论必须带 evidence(证据笔记) + data(结构化记录)，可回溯、可审计。
#   3. status 驱动生命周期：open → validated / falsified，证伪的结论不删（留作教训）。
#   4. 项目收尾回写这里；下次开场跑 `python -m script.load_context --project <PID>` 加载。
#   5. 多 task 单方向派生：子节点只写 node.parent；children / depth 由 load_context 运行时建图。
#
# 与门禁的对应（见根 AGENTS.md）：
#   G4 成稿 → 每条 claim 必须有 evidence↔data 互指；反方论点 ≥5 条（至少 1 条时间维度）
#   G5 校验 → 每条 claim 必须带 confidence + status（无悬空结论）
#   G6 回写 → monitors 带 last / as_of / threshold；queue 带 depends_on
#
# 约定：路径一律相对 workspace 根，不写绝对路径。

version: 2
project_id: P00               # 与目录前缀、project.yaml 的 id 一致（new_project.py 会回填）
updated_at: 2026-09-19

# ── 关系层（多 task 用 · 单方向派生）────────────────────────────
# parent：父节点 ID；顶层项目为 null。children / depth 由 load_context 按 parent 派生，不双写。
# 新增子 task = 只建新节点并写它的 parent，不改父文件。
node:
  parent: null
  depends_on: []              # 跨节点依赖（其他节点 ID）；当前仅展示，不做硬阻塞

# ── 当前研究焦点 ──────────────────────────────────────────────
focus:
  topic: ""                   # 当前焦点问题（load_context 渲染 topic / sector）
  type: 行业                   # 受控 6 类之一（资讯|行业|公司|热点|宏观|个人配置）
  status: active               # active | paused | done
  started_at: 2026-09-19
  rationale: ""               # 为什么现在做这件事

# ── 结论台账 ──────────────────────────────────────────────────
# confidence: high | medium | low
# status: open(待验证) | validated(已验证) | falsified(已证伪)
claims: []
#  - id: C-P00-01
#    statement: >
#      （一句话结论，带数字）
#    confidence: high
#    status: open
#    tags: [标签]                       # 多标签，便于检索 / 复用
#    evidence: archive/raw/行业/xxx.md       # 证据笔记路径（G4 要求与 data 互指）
#    data: archive/raw/行业/xxx.csv          # 结构化记录路径
#    derived_from:                          # 溯源（可选）：继承自哪个项目的哪条 claim
#      project: P01
#      claim: C-P01-03
#    next_action: Q-P00-01                   # 触发的下一步队列项
#    counter_arguments:                     # 反方论点（G4 要求 ≥5 条，至少 1 条时间维度）
#      - "什么情况下此结论会错（含 1 条时间维度）"

# ── 监控指标（带上次观测值 + 告警阈值）────────────────────────
monitors: []
#  - id: M-P00-01
#    name: ""               # 指标名（load_context 渲染用 name）
#    last: ""               # 上次观测值（G6 回写必填）
#    as_of: 2026-09-19      # 观测日期（G6 回写必填）
#    threshold: ""          # 告警阈值（方向由约定说明）
#    source: archive/raw/行业/xxx.csv   # 数据来源（可选）

# ── 下一步动作队列 ────────────────────────────────────────────
queue: []
#  - id: Q-P00-01
#    action: ""             # 待办描述（load_context 渲染用 action）
#    type: 行业             # 类型，便于分流
#    priority: P0           # P0 | P1 | P2
#    depends_on: [C-P00-01] # 依赖的 claim / 其他任务（G6 回写必填依赖关系）
#    status: pending        # pending | doing | done | dropped
#    output: archive/raw/行业/xxx.md

# ── 已归档结构化记录索引（避免下次重复抓数）────────────────────
datasets: []
#  - path: archive/raw/行业/xxx.csv   # load_context 会校验此路径是否存在
#    covers: ""                       # 覆盖内容说明
#    as_of: 2026-09-19

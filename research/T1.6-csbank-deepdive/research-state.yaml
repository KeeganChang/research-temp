claims:
  - id: C-T1.6-01
    statement: >
      常熟是五家样本中第一个出现营收负增长的：Q3 单季营收 29.69 亿元（-0.71%），而 9M 归母 +8.02% 高于营收 +3.81%，差额来源可量化为成本收入比 -4.55pct（可持续）与拨备覆盖率 -45.01pct（一次性）。
    confidence: high
    status: validated
    tags: [银行, 常熟银行, 营收负增长, 拨备释放, 成本收入比]
    evidence: research/T1.6-csbank-deepdive/T1.6-LarkDoc-主交付.md
    data: research/T1.6-csbank-deepdive/T1.6-LarkDoc-主交付.md#31
    counter_arguments:
      - "时间维度：若 2027 年 NIM 按 -11bp/年收窄，全年营收转负只是时间问题"
      - "拨备一年 -45pct，两年内或逼近 320% 一线，以拨备换利润的选项消失"
      - "成本收入比 31.11% 已接近极限，继续压降空间有限"
  - id: C-T1.6-02
    statement: >
      NIM 2.42% 仍为全样本最高（招行 1.82% 的 1.33 倍），但降幅 11bp 大于同业，且高息差来自资产端小微定价（个人经营贷占贷款 34.99%）而非负债端（活期占比仅 19.81%）。护城河与脆弱点是同一件事。
    confidence: high
    status: validated
    tags: [银行, 常熟银行, 净息差, 小微, 单一敞口]
    evidence: research/T1.6-csbank-deepdive/T1.6-LarkDoc-主交付.md
    data: research/T1.6-csbank-deepdive/T1.6-LarkDoc-主交付.md#32
    counter_arguments:
      - "大行普惠下沉（3.0%）与中小行（4.5%+）价差压缩，常熟首当其冲"
      - "个人经营贷 34.99% 是最大单一敞口，区域小微风险即全行风险"
      - "小微客群黏性与风控模型构成短期壁垒"
  - id: C-T1.6-03
    statement: >
      配置角色为小微 α（卫星仓，非核心）：体量最小（4286 亿）、拨备在释放、营收已负增长，三条都不支持持有型底仓；其价值在于息差弹性，而弹性需要营收增长配合，目前不成立。
    confidence: medium
    status: open

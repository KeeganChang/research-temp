id: P02
name: "美国加密资产市场进入调研（含 CFD / 衍生品结构空白）"
track: entry                  # 5 Track 体系：进入测绘——国别PEST → 行业 → 相邻/替代 → 用户画像 → players
status: active
created_at: 2026-09-19
updated_at: 2026-09-19

question: >
  美国加密资产这个市场，谁能进、怎么进、谁在赚钱？
  给出机会区 / 禁区 / 观察哨 + 玩家地图（而非 A股标的短名单）。

scope_in:
  - 美国宏观 + PEST（GDP / 人均 / 收入分布 / 通胀就业 / 基尼）
  - 监管框架：GENIUS Act、CLARITY Act、SEC/CFTC 联合解释、CEA 对零售杠杆的限制
  - 价值链谁收租：稳定币 / 交易所 / 清算所 / 预测市场 / 传统机构入口
  - 相邻与替代行业：零售 CFD 禁令后的需求重定向路径（CME 微型期货 / 期权 / 杠杆 ETF / 预测市场）
  - 用户画像与客单价-频次拆解
  - 主要 players 财务对照（COIN / HOOD / BLSH / Circle / CME）

scope_out:
  - 不做币价预测与择时
  - 不做链上技术分析、不评代币基本面
  - 不覆盖美国以外司法辖区（跨境对照单列为 Q-20260919-07）

deliverables:
  - "市场进入判断：机会区 / 禁区 / 观察哨"
  - "玩家地图 + 商业模式归因（谁吃 α、谁只是 β）"
  - "口径核实清单（三类数据口径冲突）"

skills: [research-core, research-track-entry, method-market-entry]
owner: "拿铁"

notes: >
  ① 准入优先于需求——美国零售 CFD 是全禁（CEA §2(c)(2)(D)），照搬欧洲打法是零到一的错误。
  ② 被禁品类要追"需求重定向的承接方"——它们往往拿到合规溢价与定价权。
  ③ 渗透率必须拆成 客单价 × 频次——高渗透 + 低客单价 ≠ 大市场。
  ④ 区分 β 与 α（稳定币=利率β、交易所=行情β、清算所≈α）；同涨同跌 = 假分散。
  ⑤ 美股财务为二手转引，关键项（如 Robinhood 经营现金流）必须回 10-K 原文核对。

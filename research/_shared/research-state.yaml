  - id: C-20260919-17
    statement: >
      **方法论**：A 股重资产制造业中，「收入增速 + 订单指引」必须配上「净现比 + 合同负债」
      才能使用。只依据前者会把资金引向"账面富贵"标的。此外净现比对周期底部/扩张期公司不公平
      （如中文存储、海光备货期），打分体系系统性偏向成熟期资产，可能低估扩张期赔率。
    confidence: medium            # 主观打分，权重依赖"2027 capex 骤降"的判断
    status: open
    tags: [方法论, 净现比, 合同负债, 打分局限]
    derived_from: {project: P01, claim: C-20260919-11}

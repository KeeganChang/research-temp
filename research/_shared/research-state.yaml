  - id: C-20260919-16
    statement: >
      **方法论**：当「高现金流 + 低估值」与「负现金流 + 高估值」同时存在于同一市场时，
      驱动变量不是基本面，而是**资金的故事偏好**。宁德 16.44x PE 提供 139% 净现比和 602 亿
      真现金，而盈利弱一个数量级、经营现金流为负（-4.28 亿）的 AI 芯片标的享受约 195x 估值。
      推论：判断轮动应盯**资金的边际流向**而非静态估值差——前者有推力，后者可能长期不回归。
    confidence: medium            # 基于单日横截面，需更长时间序列验证
    status: open
    tags: [方法论, 估值, 资金流向, 风格切换]
    derived_from: {project: P01, claim: C-20260919-14}
    evidence: archive/raw/公司/20260919_公司_宁德时代-资金面撤离重估_v1.md
    data: archive/raw/公司/20260919_公司_宁德时代-资金面撤离重估_v1.csv

  - id: C-20260919-24
    statement: >
      **方法论（Track B 通用）**：做特定国家/行业的市场进入调研时，
      ① **准入优先于需求**——先问合不合法（美国 CFD 是全禁，照搬欧洲打法是零到一的错误）；
      ② **被禁品类要追"需求重定向的承接方"**——它们往往拿到合规溢价与定价权；
      ③ **渗透率必须拆成 `客单价 × 频次`**——高渗透 + 低客单价 ≠ 大市场；
      ④ **区分 β 与 α**（稳定币=利率β、交易所=行情β、清算所≈α）；
      ⑤ **同涨同跌 = 假分散**（COIN/HOOD/BLSH/IBIT 同日 +6%~12%，定价同一 β）。
    confidence: high
    status: open
    tags: [方法论, TrackB, 准入, 需求重定向, 客单价]
    derived_from: {project: P02, claim: C-20260919-19}
    evidence: archive/raw/行业/20260919_行业_美国加密资产市场进入调研_v1.md

# _shared · 跨项目方法论沉淀（不是某个具体项目）
#
# 存放"换个项目还能用"的方法论结论，带 derived_from 溯源到产生它的项目。
# 单项目内的结论留在各自 research-state.yaml，不要往这里堆。

id: _shared
name: "跨项目方法论沉淀"
track: null                   # 跨项目方法论沉淀，不绑定任一 Track
kind: shared                  # 约定：load_context 默认把它附在最后
status: active
created_at: 2026-09-19
updated_at: 2026-09-19

question: >
  哪些调研方法/判别规则是可跨项目复用的？把它们从具体结论里抽出来，避免每个项目重新踩一遍坑。

scope_in:
  - 估值与资金的方法论（不是某个行业的结论）
  - 财务质量判别规则（净现比 / 合同负债 / 自由现金流怎么用、什么时候不该用）
  - Track B 类调研的通用判别点

scope_out:
  - 任何具体行业/公司的结论（那是项目的事）

deliverables:
  - "可复用判别规则清单（随项目推进持续提升）"

skills: []
owner: "拿铁"

notes: >
  提升标准：一条结论如果换个标的/换个国家还成立，就属于方法论，提升到这里；
  只在当下案例成立的具体结论，留在项目里。

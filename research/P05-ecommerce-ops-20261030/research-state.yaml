focus:
  topic: "多平台直播电商：自然流量稀释与 GMV 增长质量的归因"
  type: 公司
  status: active
  started_at: 2026-10-30
  rationale: >
    作为 method-ecommerce-ops（belongs_to_track: diagnostic）的首个端到端验证案例。
    同时回答一个可判定的经营问题：自然流量占比掉下来了，到底是「自然变差」还是「付费挤占」。

claims:
  - id: C-P05-01
    statement: >
      抖音 GMV 的账面增长（2025Q1→2026Q3 +¥71,777，+16.6%）完全是曝光规模堆出来的：
      规模效应贡献 +¥134,160，但被流量结构迁移 −¥43,118 与客单价下滑 −¥23,118 吃掉 49.4%。
      换言之，抖音每多买一倍曝光，换回来的 GMV 边际效率在系统性下降。
    confidence: high
    status: open
    tags: [归因, 流量结构, 抖音]
    evidence: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1.md
    data: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1_Q13.csv
    next_action: Q-P05-01
    counter_arguments:
      - "相关非因果：四因素分解是会计恒等式的链式替换，不能证明「付费扩张导致 GMV 受损」，只能证明结构变化的量级。"
      - "幸存者偏差：Fact_ad_daily 的消耗与漏斗付费曝光同源生成，若真实后台存在品牌词/自然搜索归因，付费份额会被高估。"
      - "口径伪落差：客单价口径若按「下单金额」而非「支付金额」计（本报告用支付金额），-¥23,118 的客单项可能部分消失。"
      - "【时间维度】2026Q4 仅覆盖到 10-30，且 Q1 基线处在大促与冷启动混合期；若改为滚动 4 季度均值，结构项的 −¥43,118 可能收敛到 −¥30,000 量级。"
      - "外生冲击未隔离：21 个月内平台算法调整、品类淡旺季均未建模，规模项可能被误判为「可控投放成果」。"

  - id: C-P05-02
    statement: >
      自然流量并没有萎缩，是付费扩张在稀释：抖音自然曝光仅 0.98x（绝对量几乎零增长），
      付费曝光 1.77x。四渠道中仅视频号是自然与付费同步健康扩张（1.57x / 1.61x）。
      所以问题定性是「结构稀释」，不是「自然获客能力衰退」。
    confidence: high
    status: open
    tags: [归因, 流量结构]
    evidence: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1.md
    data: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1_Q14.csv
    next_action: Q-P05-02
    counter_arguments:
      - "分母漂移：自然曝光「持平」是绝对人次口径；若分母应为「可触达人群规模」，平台大盘增长时持平即等于份额下滑。"
      - "归因边界：自然曝光量未跌，不代表自然侧的质量没跌——需配合 C-P05-03 的自然每曝光支付率一起看，不能单独成立。"
      - "样本口径：所谓的 0.98x 建立在按月的指数增长生成参数上，真实业务的自然流量多为脉冲式（单条爆款视频），平滑比值掩盖波动。"
      - "【时间维度】若把基线换成 2025Q3（而非 Q1），抖音自然曝光倍数会从 0.98x 变为约 0.95x，方向不变但幅度受基线选择影响。"
      - "修复副作用：若据此反向压缩付费以抬升自然占比，可能直接牺牲 C-P05-01 里唯一为正的规模项。"

  - id: C-P05-03
    statement: >
      付费流量是「双重劣势」资产：单位效率系统性低于自然（每曝光支付率 自然/付费 =
      抖音 1.64x、淘宝 1.47x、快手 1.40x、视频号 1.33x），且单位成本持续上涨
      （千次曝光成本 21 个月涨 8.3%~27.5%），两者叠加推动抖音付费 ROI 从 4.08 跌到 3.22（−21.1%）。
    confidence: medium
    status: open
    tags: [投放效率, ROI]
    evidence: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1.md
    data: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1_Q07.csv
    next_action: Q-P05-03
    counter_arguments:
      - "相关非因果：付费转化低于自然，可能只是因为付费触达的是漏斗更外层的人群（人群不同而非流量更差），并非投放动作本身低效。"
      - "ROI 口径分歧：本报告的 ROI = 付费带来的 GMV / 广告消耗，未扣退货与毛利；按净毛利 ROI 口径，四渠道的相对排序可能重排。"
      - "未控变量：21 个月内各渠道的付费产品组合（投流 vs 千川 vs 磁力引擎）未建模，CPM 上涨可能部分是投放产品结构升级而非单纯涨价。"
      - "【时间维度】2026Q4 的 ROI 读数（抖音 3.12、淘宝 2.18）不足整季，若补齐到 12-31，跌幅趋势可能被证实也可能回归。"
      - "反向可能：付费低效但若具备「拉新破圈」外溢，其长期价值无法在本数据集的当期 GMV 口径中体现。"

  - id: C-P05-04
    statement: >
      全渠道漏斗的最大单一漏点是「停留>30s → 点击购物车」，仅 19.88%（2026Q3 账户口径），
      且四渠道高度一致（视频号最高 24.16%、淘宝最低 15.74%）——说明这是货品/话术侧的共性短板，
      而非某个渠道的流量质量问题。快手另有一处独立缺陷：下单→支付仅 72.85%（其余渠道 89%~92%），
      对应货品角色表里的未支付损失率高达 24%~27.5%。
    confidence: medium
    status: open
    tags: [漏斗, 漏点]
    evidence: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1.md
    data: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1_Q11.csv
    next_action: Q-P05-04
    counter_arguments:
      - "口径敏感性：19.88% 是把「停留>30s」设为加购前置条件的严格嵌套口径；若允许未过 30s 直接加购，该层率值会显著上升、漏点判断可能位移。"
      - "窗口效应：本结论跑在 2026Q3（92 天）窗口；同一漏斗在 668 天全窗口上账户口径会虚高到 62.31%（见 Q08 全窗口读数），窗口选择直接改变结论形态。"
      - "反方证据缺口：快手支付率低被归因为掉单，但也可能是预售/货到付款类订单在支付口径外结算，需在真数据中验证是否存在支付回流延迟。"
      - "【时间维度】2026Q4 不足整季且包含双11（10-30 之前已进入预售周期），10 月读数不能外推到 11 月。"
      - "修复收益不确定：补全「讲完卖点即刻引导加购」的话术能否把 19.88% 抬到 25%，取决于品类；低价引流款占比越高，加购率天然越高但客单越低。"

  - id: C-P05-05
    statement: >
      人群换新是转化稀释的重要来源：期内新增账户占 UV 的 53.7%，其支付转化率 5.11%，
      显著低于存量账户的 7.75%（相对差 −34%）。即自然占比下降的同时，
      曝光的构成也在向「低转化新客」倾斜，形成叠加稀释。
    confidence: medium
    status: open
    tags: [人群结构, cohort]
    evidence: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1.md
    data: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1_Q15.csv
    next_action: Q-P05-05
    counter_arguments:
      - "存量vs新增的定义依赖 dim_account.first_seen，真实后台缺此字段时该结论无法复现（口径不可迁移）。"
      - "生命周期混淆：存量账户转化高可能只因为它有更长的曝光窗口（21 个月 vs 几天），是观测时长差异而非人群质量差异。"
      - "双向因果：也可能是「长期投流拉来了质量更差的新客」，把 C-P05-03 与 C-P05-05 互为因果，不能同时当成两个独立损失项加总。"
      - "【时间维度】新客占比在冷启动期（2025H1）天然更高，本结论跑在全窗口，若只看 2026Q3 单季，新增占比与差距都会缩小。"
      - "反方解读：新客转化低是行业常态，5.11% 未必是异常值；真正的异常可能是「新客并未在后续转化为存量」（需复购数据，本项目 scope_out）。"

  - id: C-P05-06
    statement: >
      四个渠道均存在重度主播单点依赖：Top1 主播吃掉各自渠道 GMV 的 53.7%~57.4%，
      Top2 合计 76.0%~79.4%，而其曝光占比仅 50%~52.6%——即头部主播的单位曝光产出明显更高，
      一旦轮换/流失，对应渠道 GMV 会立即出现两位数缺口。
    confidence: medium
    status: open
    tags: [主播, 单点依赖]
    evidence: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1.md
    data: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1_Q12.csv
    next_action: Q-P05-06
    counter_arguments:
      - "曝光归属混淆：Top1 曝光占 50% 却产出 57% GMV，差异可能来自该主播被安排在黄金时段（时段 confounder），而非个人能力。"
      - "合成数据痕迹：主播转化乘数与出场抽签由固定参数生成，集中度是设计出来的（HOST_WEIGHTS 头部 0.42），真实排班往往更均衡。"
      - "口径未区分：这里的 GMV 未扣除退货，若头部主播推的是高退货品类，集中度会被高估。"
      - "【时间维度】集中度是 21 个月累计口径；分季度看新人主播培养进度上升会让 Top1 占比自然下降，当前读数不代表稳态。"
      - "反方价值判断：高集中度未必是风险——若头部主播可复制方法论，集中反而是效率优势，取决于是否有主播梯队，本项目无梯队数据。"

  - id: C-P05-07
    statement: >
      视频号是四渠道里唯一的「健康样本」：自然流量占比 72.66% 且结构漂移几乎为零
      （−0.47pp）、付费 ROI 6.02 为四渠道最高且 21 个月未衰减、GMV 增量几乎全部由规模效应贡献
      （+¥188,342 / 总增量 ¥209,982）。它是预算再分配的第一承接方，但当前 GMV 占比 31.2%，
      承接能力受公开公域池规模限制。
    confidence: medium
    status: open
    tags: [渠道对比, 预算再分配]
    evidence: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1.md
    data: archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1_Q16.csv
    next_action: Q-P05-07
    counter_arguments:
      - "幸存者偏差：视频号数据好可能正因为规模小（GMV 占比 31.2% 但曝光占比最低），小样本下自然占比天然更高、稀释更慢。"
      - "反方归因：视频号自然占比高的本质是「私域 + 社交推荐」，这套机制未必能平移到抖音的内容推荐场景，加投未必复制效率。"
      - "兰彻斯特平方律：从抖音挪预算到视频号，视频号的 CPM 会随投放强度上升；ROI 6.02 是在低投放强度（¥12.6万/21月）下取得的，不可外推。"
      - "【时间维度】视频号 2025Q3 ROI 曾冲到 7.59 随后回落至 6.16，波动幅度大于其他渠道；用单点季度读数下结论不稳。"
      - "可修复空间被高估：Q16 反事实测算视频号仅 ¥557/季度可修复——因为它本来就没有偏离基线，所谓「承接方」的结论不是由修复空间论证的。"


# P05 · 电商直播多平台经营漏斗诊断（research-track-diagnostic 首个案例）
#
# 背景：把「以电商为案例的经营分析」沉淀成 method-ecommerce-ops 之后，需要一个真实跑通的
# 端到端验证：合成数据入 SQLite → Python 调 SQL 做 M1–M5 / R1–R2 → 出诊断书 + 修复矩阵。
#
# 选线依据（ROUTING.md 决策树）：已有明确对象（四渠道经营）+ 可量化落差（自然流量占比
# 57.41%→50.91%）+ 问的是「为什么」→ diagnostic。刻意避开「diagnostic 变 drill」反模式：
# 本项目不做「哪个渠道最好」的选优，只做归因与修复空间测算。

id: P05
name: "电商直播多平台经营漏斗诊断"
track: diagnostic
status: active
created_at: 2026-10-30
updated_at: 2026-10-30

question: >
  某多平台直播电商品牌在 2025-01-01~2026-10-30 的 21 个月里，
  全渠道自然流量占比由 57.41% 降至 50.91%、抖音渠道更从 57.84% 跌到 43.22%，
  同时 GMV 增幅（+27.1%）显著低于曝光增幅（+25.6%）应有的水平。
  这一「自然流量被稀释 + GMV 增长质量下降」的偏离，结构性根因是什么？可修复空间有多大？

scope_in:
  - "四渠道：抖音 / 淘宝直播 / 视频号 / 快手，周期 2025-01-01 ~ 2026-10-30（668 天）"
  - "账户粒度漏斗明细：曝光 → 进入 → 停留>30s → 点击购物车 → 下单 → 支付，严格嵌套"
  - "流量结构（自然 vs 付费）、投放效率（ROI / 千次曝光成本）、货品角色、主播集中度"
  - "GMV 变动四因素分解：规模 / 结构 / 效率 / 客单；以及维持基线流量结构的反事实测算"

scope_out:
  - "不涉及实时爬虫抓数（数据由 script/gen_ecommerce_data.py 按受控参数合成，可复现）"
  - "不涉及毛利/退货/履约成本；GMV 为支付口径，未扣退款"
  - "不做单渠道排位优选（那是 drill track 的活），只做归因与修复排序"
  - "不做增长预测建模（那是 scenario track 的活）"

deliverables:
  - "根因诊断书：四因素分解 + 自然/付费结构归因（archive/raw/公司/20261030_公司_电商直播经营漏斗诊断_v1.md）"
  - "修复优先级矩阵 P0/P1/P2 + 跨渠道预算再分配建议"
  - "关键指标监控表（带告警阈值），见 research-state.yaml 的 monitors"
  - "可复现的分析链路：script/gen_ecommerce_data.py + script/analyze_ecommerce.py"

skills: [research-core, method-ecommerce-ops]
owner: "拿铁"

notes: >
  口径铁律（本项目最关键的一条）：漏斗一律用「账户口径 cohort-locked」——
  第 k 层 = COUNT(DISTINCT CASE WHEN step_k=1 THEN account_id END)，
  分母 = 同窗口曝光账户全集；每个分析窗口独立锁定自己的曝光 cohort，
  窗口外新增的账户永不进入该窗口的分母。
  曝光口径(行级 SUM) 仅在 GMV 四因素分解中使用（因为行级才具备可加性），
  两者的差异已由 Q09 量化登记（抖音进入率 账户36.84% vs 曝光11.23%）。

  另一处踩坑：账户口径在长窗口上会失真——同一账户在 668 天内被反复曝光，
  导致「至少进入过一次」的比例虚高到 62.31%。所以头版漏斗必须跑有界窗口
  （本报告取 2026Q3），长窗口漏斗只看做一个提示而非结论。

  已知局限：本数据集为合成样本，绝对转化率落在行业区间偏上沿；
  所有结论依赖「相对结构与归因分解」，不依赖绝对基准值。

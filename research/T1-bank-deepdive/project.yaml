# 驱动问题：这个项目最终要回答的那一个问题（必须可判定）
question: >
  P06 显示银行是唯一主推、其余行业补涨/阴跌。本 task 对 A 股银行板块做全览 + 主推归因：行业概览→竞争格局→估值对比→归因『为何银行是唯一主推』；并回答银行板块内部谁最值得配、该主推逻辑在宏观/基本面/资金上是否可持续。

# 边界：写清楚"不做什么"比写"做什么"更能防跑偏
scope_in:
  - "A 股全部上市银行（42 家：国有大行 6 + 股份行 9 + 城商行 17 + 农商行 10）；按 market-researcher primer 链覆盖 行业概览 → 竞争格局 → 估值对比 → 主推归因"
  - "数据来源：NeoData（板块成分股 + 估值百分位 + 资金流）/ westock（K线 + 技术指标 + 筹码）/ 公开年报与监管披露；每项数字带内联引用"
  - "主推归因须回答三维为何共同支撑银行：宏观（利率 / 信用 / 地产风险）、基本面（息差 / 不良 / 拨备）、资金（主力流向 / 相对收益）"
scope_out:
  - "不涉及港股 / 美股银行（跨境比较仅作背景，不入主交付）"
  - "不做单一个股深度财务建模；若落到具体主推标的，转 A3 子 task 处理"
  - "不做择时与仓位建议；不覆盖非银金融（券商 / 保险 / 信托 / 租赁）"

# 交付物：项目结束时应该有哪几份东西
deliverables:
  - "银行行业 primer 笔记（Lark Doc 主交付：口径块 + 内联引用 + reference；复杂计算挂 Sheet）"
  - "A 股银行估值对比 spread（NTM PE / PB / 股息率横向对比，标 outlier 与口径 caveat）"
  - "主推归因结论 + 可持续性判定（含 ≥5 反方、≥1 时间维度；confidence + status）"
  - "可配短名单 3–5 家（各一句 thesis hook）"

skills: [research-core, method-topdown]
owner: "拿铁 Latte（执行）｜ 喵老板（审批）"


# research-state.yaml —— 项目状态机模板
#
# 解决的问题：调研结论散落在 md 正文里，下次会话读不到、要重做。
# 设计原则：
#   1. 只存「可执行的沉淀」——结论(claims)、监控(monitors)、待办(queue)、已归档数据(datasets)，不抄正文。
#   2. 每条结论必须带 evidence(证据笔记) + data(结构化记录)，可回溯、可审计。
#   3. status 驱动生命周期：open → validated / falsified，证伪的结论不删。
#   4. 项目收尾回写这里；下次开场跑 `python -m script.load_context --project <PID>` 加载。
#   5. 多 task 单方向派生：子节点只写 node.parent；children / depth 不存储，由 load_context 运行时建图。
#
# 与门禁的对应（见 research-kit/references/AGENTS.md）：
#   G4 成稿 → 每条 claim 必须有 evidence↔data 互指；反方论点 ≥5 条（至少 1 条时间维度）
#   G5 校验 → 每条 claim 必须带 confidence + status（无悬空结论）
#   G6 回写 → monitors 带 last / as_of / threshold；queue 带 depends_on
#
# 约定：路径一律相对 workspace 根，不写绝对路径。


# ── 结论台账 ──────────────────────────────────────────────────
# confidence: high | medium | low
# status: open(待验证) | validated(已验证) | falsified(已证伪)
claims:
  - id: C-T1-01
    statement: >
      银行为 P06 唯一主推，核心由四维合力驱动：资金再配置（科技回撤→红利蓄水池）、
      基本面拐点（2026Q2 净息差 1.41% 环比+1bp，2022 来首次单季环比回升）、
      高股息确定性硬化（六大行分红比例 30%→31%、合计派息超 2200 亿）、
      估值地板（42 家全破净、平均 PB 0.56）+ 长线锁仓（险资第一大持仓 ~23%）。
    confidence: high
    status: validated
    tags: [主推归因, 资金, 基本面, 高股息]
    derived_from:
      project: P06
      claim: C-P06-主推-银行
    counter_arguments:
      - "【时间维度】风格'跷跷板'可逆：2026-07 银行月涨 14%，8 月初 AI 反弹单日跌回大半，相对收益依赖成长端持续弱势（中国金融网 2026-08）。"
      - "净息差企稳是'阶段性'：资产端收益率下行未根本扭转，负债成本改善幅度收窄，若重现单边下行则分红逻辑松动（新浪财经 2026-10-22）。"
      - "零售信贷风险未出清：信用卡/消费贷/经营贷不良生成率仍升，招行亦承认为客观事实，可能吞噬利润与拨备（新华财经 2026-09-01）。"
      - "主动基金低配(1.1%)是双刃：提供向上燃料但增量受限；被动资金(沪深300ETF)若转向，权重大行直接承压（格隆汇 2026-07）。"
      - "破净≠必然修复：修复依赖'确定性溢价'共识；若经济强复苏、资金回流成长，相对收益收敛（中新网 2026-10-09）。"
      - "分红可持续性约束：华夏(-18.35%)/光大(-24.01%)因增提拨备致利润负增，分红覆盖率须逐季跟踪（新华财经 2026-09-01）。"
  - id: C-T1-02
    statement: >
      A 股银行盈利分化显著：城商行 ROE 均值 11.78% 领跑，国有大行 9.06%，股份行 8.39% 垫底；
      头部个体杭州银行 17.74%（全行业第一）、农行为唯一 ROE 破 10% 的国有行（10.14%）。
    confidence: high
    status: validated
    tags: [竞争格局, ROE, 分化]
    counter_arguments:
      - "城商行高 ROE 含区域集中度风险：当地产业/地产波动时风险也集中，不可等同于低风险。"
  - id: C-T1-03
    statement: >
      银行内部短名单（5 家）：农业银行(601288)、杭州银行(600926)、成都银行(601838)、
      招商银行(600036)、常熟银行(601128)——分别对应确定性底仓/区域标杆/极致资产质量/零售壁垒/农商行标杆。
    confidence: medium
    status: open
    tags: [短名单, 配置]
    counter_arguments:
      - "落单一个股深度财务建模属 A3 子 task 范畴，本名单仅为行业层初筛，未经个股级现金流拆分验证。"
  - id: C-T1-04
    statement: >
      主推逻辑绝对收益（股息+温和修复）确定性高、中期可持续；相对收益（跑赢其他行业）中期可持续
      但依赖成长板块弱势延续。与 P06'唯一主推、其余补涨/阴跌'判定一致。
    confidence: medium
    status: open
    tags: [可持续性, 判定]
    counter_arguments:
      - "若风险偏好回升 + 科技业绩兑现，相对收益收敛，银行退居'底仓'而非'主推'。"


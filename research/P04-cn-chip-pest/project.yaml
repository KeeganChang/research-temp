# 驱动问题：这个项目最终要回答的那一个问题（必须可判定）
question: >
  在国内（中国大陆）做芯片生意，宏观环境到底"让不让你进、怎么进、谁在赚"？
  政治/监管、经济、社会、技术四股力量分别把国产芯片推往哪、又卡在哪？
  哪些环节是被海外管制"逼出来的需求重定向"（承接方拿到合规溢价），哪些是真技术突破？

# 边界：写清楚"不做什么"比写"做什么"更能防跑偏
scope_in:
  - 中国大陆芯片产业（设计/EDA → 制造/IDM → 设备 → 材料 → 封测/先进封装 → 存储）的 PEST 环境
  - 以 2026 年现行政策与管制为分析窗口；监管分"已生效 / 已通过待生效 / 悬而未决"三档
  - 与 P03（cn-chip，Track A 景气度选标的）互补：P03 回答"买哪只、兑现分几层"，本项回答"环境允不允许、需求被谁承接"
scope_out:
  - 不重复 P03 的景气度/兑现度打分（仅引用其结论作为下游依据）
  - 不做个股财务对照（归 `method-topdown` a3 公司段 / P03 范围）
  - 不涉及资讯域日频

# 交付物：项目结束时应该有哪几份东西
deliverables:
  - 国内芯片行业 PEST 四维特写（archive/raw/行业/）
  - 监管三档表 + 相邻/替代行业（被管制品类的需求重定向）分析
  - 强制反方论点清单（≥5，含时间维度）
  - 机会区 / 禁区 / 观察哨 + 玩家地图（Track B ⑤）

skills: [research-core, research-track-entry, method-market-entry]
owner: "拿铁"

notes: >
  与 P03 互补不重复：P03 = Track A 景气度（选标的），P04 = Track B 环境（看准入与格局）。
  本项重点是用 PEST 四透镜 + Track B 的"被禁品类→需求重定向→承接方溢价"判别点，
  把 P03 里散落的"国产化三级梯队/卡脖子"上升为结构化环境图谱。
  口径陷阱已现：Omdia 2026 中国半导体市场规模 8120.8 亿美元(+92.9%) 与
  中国半导体行业协会 2025 销售收入 1.7 万亿元 差约 3 倍，疑含 AI 服务器整机/广义口径，
  二者并列不取平均；本报告以协会口径为锚、Omdia 作上限参考。
  数据窗口以 2026-09 公开信息为主，政策以"十五五"开局 + 大基金三期全面落地为基线。

focus:
  topic: "国内芯片行业 PEST 环境分析（Track B 市场进入视角）"
  type: 行业
  status: active
  started_at: 2026-09-24
  rationale: >
    与 P03（Track A 景气度选标的）互补：用 PEST 四透镜 + Track B 的"被禁品类→需求重定向→承接方溢价"
    判别点，把 P03 的国产化三级梯队上升为结构化环境图谱，回答"环境允不允许进、需求被谁承接"。

# ── 结论台账 ──────────────────────────────────────────────────
claims:
  - id: C-P04-01
    statement: >
      国内芯片产业处于"外部管制高压 × 内部举国体制托底 × AI 需求拉动"三重力量挤出的窗口期：
      准入端被海外卡脖子，但需求被管制逼出国产化重定向（合规溢价+订单+资本三重红利）。
    confidence: high
    status: open
    tags: [PEST, 国产化, 窗口期]
    evidence: archive/raw/行业/20260924_行业_国内芯片行业PEST_v1.md
    data: archive/raw/行业/20260924_行业_国内芯片行业PEST_v1.csv

  - id: C-P04-02
    statement: >
      管制形成"被禁品类→需求重定向→承接方溢价"结构：国产设备/材料验证加速、Chiplet/先进封装换道、
      RISC-V 规避授权、第三代半导体换道；承接方拿到合规溢价+政策入口+资本入口+订单倾斜。
    confidence: high
    status: open
    tags: [TrackB, 需求重定向, 承接方溢价]
    evidence: archive/raw/行业/20260924_行业_国内芯片行业PEST_v1.md
    data: archive/raw/行业/20260924_行业_国内芯片行业PEST_v1.csv

  - id: C-P04-03
    statement: >
      设备国产化率 2024≈21% → 2026E 26% → 2028E 43%，为六环节最陡斜率，是国产化主线。
    confidence: high
    status: open
    tags: [设备, 国产化率, 斜率]
    evidence: archive/raw/行业/20260924_行业_国内芯片行业PEST_v1.md
    data: archive/raw/行业/20260924_行业_国内芯片行业PEST_v1.csv

  - id: C-P04-04
    statement: >
      材料国产化率口径冲突（中银15%整体/新浪45%2026E/SEMI China40%），共识为晶圆材料<15%、封装<30%，
      EUV 光刻胶/高端硅片仍进口；必须并列不取平均。
    confidence: medium
    status: open
    tags: [材料, 口径冲突, 国产化率]
    evidence: archive/raw/行业/20260924_行业_国内芯片行业PEST_v1.md
    data: archive/raw/行业/20260924_行业_国内芯片行业PEST_v1.csv

  - id: C-P04-05
    statement: >
      EUV 光刻机、EDA 工具链、HBM 量产代差、先进封装 Interposer/混合键合材料为硬禁区，
      决定国产化的真实天花板（能走多高而非多快）。
    confidence: high
    status: open
    tags: [卡脖子, 禁区, EUV, EDA]
    evidence: archive/raw/行业/20260924_行业_国内芯片行业PEST_v1.md

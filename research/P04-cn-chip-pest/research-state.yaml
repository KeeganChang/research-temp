  - id: C-P04-06
    statement: >
      中国半导体市场规模口径冲突：Omdia 2026E 8120.8 亿美元(+92.9%) 与 中国半导体行业协会 2025 销售收入
      1.7 万亿元差约 3 倍（疑含 AI 整机广义口径），须并列不平均，以协会口径为锚。
    confidence: high

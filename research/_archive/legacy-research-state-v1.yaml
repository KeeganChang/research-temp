# config/research-state.yaml — 研究状态机（跨会话记忆的唯一规范源）
#
# 解决的问题：调研结论/建议/监控指标散落在 md 正文里，下次会话读不到、要重做。
# 设计原则：
#   1. 只存「可执行的沉淀」——结论(claims)、监控指标(monitors)、待办(queue)，不抄正文。
#   2. 每条结论必须带 evidence(证据笔记) + data(结构化记录)，可回溯、可审计。
#   3. status 字段驱动生命周期：open → validated / falsified，证伪的结论不删，留作教训。
#   4. 下次会话开场跑 `python -m script.load_context` 即加载全部上下文。
#
# 约定：路径一律相对 workspace 根，不写绝对路径。

version: 1
updated_at: 2026-09-19

# ── 两条调研主线（2026-09-19 确立，见 docs/prototype/07-调研主线方法论.md）──
tracks:
  - id: A
    name: 景气链 Top-Down（选标的）
    flow: 宏观（钱往哪流）→ 行业（景气兑现度）→ 公司（龙头/个股）
    skills: [research-macro, research-industry, research-company]
    end_product: 可交易标的短名单
    status: active
    notes: >
      已跑通三段。硬规矩：①落点必须是钱（四路资金交叉验证）②收入增速必须配现金流质量
      ③反方论点≥5条且至少1条时间维度。
  - id: B
    name: 特定行业市场进入调研（看准入与格局）
    flow: 国别宏观+PEST → 目标行业 → 相邻/替代行业 → 用户画像 → 主要 players
    skills: [research-market]
    end_product: 市场进入判断（机会区/禁区/观察哨）+ 玩家地图
    status: active
    started_at: 2026-09-19
    first_case: 美国加密资产（含 CFD/衍生品结构空白）
    notes: >
      与 Track A 的关键差异：第一步必须问"合不合法"而非"有没有需求"；
      被禁品类要追"需求重定向的承接方"；渗透率要拆成客单价×频次。


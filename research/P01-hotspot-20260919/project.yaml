# P01 · 2026-09-19 行业热点观察（drill 首个案例）
#
# 一次「日期 + 主题」的行业热点观察：从当天宏观资金面出发，
# 锁定热钱最集中的行业做深度，再落到个股 / 对照组收口。
# 与 P02（美国加密市场进入）并行，两条线互不污染。
#
# 目录命名：`P<编号>-<slug>-<YYYYMMDD>`（观察类项目带日期，便于按日归档、后续可建同名新项目）。

id: P01
name: "2026-09-19 行业热点观察"
track: drill                  # 5 Track 体系：下钻选优——宏观资金 → 行业景气 → 公司，终点是可交易标的短名单
status: active
created_at: 2026-09-19
updated_at: 2026-09-19

question: >
  2026-09-19 这一天，A股的钱正在往哪些行业走？
  热钱最集中的那条链，景气度究竟兑现到了哪一层？
  六条细分赛道里谁是真兑现、谁是账面富贵？最后给一份可交易标的短名单 + 一个反向对照组。

scope_in:
  - 当日资金面全景：主力日/周、北向、ETF、概念板 YTD 四路交叉验证 → 锁定热钱最集中的行业
  - 热点行业下钻：A股半导体 / AI 算力链六条细分赛道（算力芯片 / 存储 / 光模块 / 设备 / 先进封装 / 晶圆代工）
  - 三维打分：收入增速 × 现金流质量（净现比 / 经营现金流）× 订单能见度（合同负债 / 存货 / 应收）
  - 对照组：宁德时代（CATL）——回答"高现金流低估值 vs 负现金流高估值，杀的到底是估值还是基本面"

scope_out:
  - 不做技术路线预测（HBM 世代、先进制程节点之争）
  - 不覆盖海外半导体公司（美股设备/代工仅作参照，不打分）
  - 不做量化择时

deliverables:
  - "当日资金面全景 + 热钱最集中行业的判定（宏观篇）"
  - "六条细分赛道三维打分表（收入增速 × 现金流质量 × 订单能见度）"
  - "可交易标的短名单 + 淘汰理由（含自我证伪记录）"
  - "对照组公司重估（CATL）：估值 / 基本面 / 时间 三分法定性"
  - "过热预警监控表（M-01~M-07）"

skills: [research-core, research-track-drill, method-topdown]
owner: "拿铁"

# 本项目踩坑换来的硬规矩（跨项目可复用的已提升进 research/_shared/）
notes: >
  ① 落点必须是"钱"——宏观段用四路资金交叉验证，单看一路容易被口径骗。
  ② 收入增速必须配现金流质量——只用"增速+订单指引"会把资金引向账面富贵标的
     （中际旭创 C-20260919-12 已自我证伪一次，结论保留不删）。
  ③ 反方论点 ≥5 条，且至少 1 条是时间维度的失效点（本项目为"2027 capex 骤降"）。
  ④ 打分体系对扩张期资产不公平（净现比对备货期公司天然偏低），读分时留意赔率被低估。
  ⑤ 公司层要区分"杀估值 vs 杀基本面"：下跌不等于错杀，用三分法（估值 / 基本面 / 时间）分开定价。

# ── 结论台账 ──────────────────────────────────────────────────
claims:
  - id: C-P06-01
    statement: >
      双高象限（资金流入 + 近 3 月动量转正）仅 3 个行业：银行、煤炭、石油石化。
      其中**银行是唯一真 α** —— 资金 +26 亿、近 3 月 +7.0%、YTD +4.8%、振幅仅 17（全场最低），
      且与最相关对手的相关系数 0.76 为双高象限中最低（波动不同源）。
    confidence: medium          # 相关系数 n=9 期，独立性判定带噪声
    status: open
    tags: [行业景气, 资金流, 银行, 四象限]
    evidence: research/P06-sector-momentum-20261030/artifacts/sector_monthly/industry_sentiment_2026_v2.html
    data: research/P06-sector-momentum-20261030/artifacts/sector_monthly/analysis_v2.json
    next_action: Q-P06-04
    counter_arguments:
      - "价格景气 ≠ 基本面景气：月度环比只反映定价边际，未含盈利 / 订单 / 产能。"
      - "【时间维度】资金流是 2026-10-29 单日快照（日频 T+1，无周度聚合），日内反转 / 尾盘拉抬会失真。"
      - "幸存者偏差：只看流入 Top 会忽略流出侧同量级信号（电子 -253 亿），单边叙事偏乐观。"
      - "指数编制失真：板块指数多为市值加权，银行读数被四大行绑架，未必代表全行业。"
      - "事件脉冲不可外推：银行 / 煤炭 / 石油石化 10-29 集体创新高，部分受当日避险资金推动（见 C-P06-03）。"

  - id: C-P06-02
    statement: >
      国防军工是**事件脉冲而非趋势反转**：资金流入第 1（+39 亿）但近 3 月 -4.8%、YTD -24.4%、振幅 36。
      催化为海上发射三项国家标准 2026-11-01 实施（一次性重定价）。
    confidence: high
    status: open
    tags: [行业景气, 事件驱动, 国防军工, 脉冲]
    evidence: research/P06-sector-momentum-20261030/artifacts/sector_monthly/industry_sentiment_2026_v2.html
    data: research/P06-sector-momentum-20261030/artifacts/sector_monthly/analysis_v2.json
    next_action: Q-P06-03
    counter_arguments:
      - "国标实施若带来订单实质落地，脉冲可能转为趋势（需 11 月后订单 / 招标数据验证）。"
      - "【时间维度】单日流入 -24.4% YTD 的深跌板块，也可能是底部反转的第一根资金信号。"

  - id: C-P06-03
    statement: >
      ★ 方法论结论：2026-10-29 全市场超 4700 只个股下跌，当日资金流被**避险属性**主导而非景气趋势，
      导致「脉冲」象限系统性虚高（5 个脉冲行业中 4 个为当日流入 + 中期下跌的防御品种）。
      → 已固化为 method-sector-momentum 的「M4 大跌日修正」硬规矩。
    confidence: high
    status: validated
    tags: [方法论, 资金流, 口径, 大跌日]
    evidence: research/P06-sector-momentum-20261030/artifacts/sector_monthly/industry_sentiment_2026_v2.html
    data: research/P06-sector-momentum-20261030/artifacts/sector_monthly/analysis_v2.json
    counter_arguments:
      - "若后续在上涨日重跑仍出现同样结构，则「避险主导」解释不成立，需另找原因。"

  - id: C-P06-04
    statement: >
      同涨同跌检验：电子-通信 ρ=0.94、计算机-有色金属 ρ=0.94、煤炭-石油石化 ρ=0.91（月度环比，n=9 期）
      → 这些组合定价同一 β，同时持有属**假分散**。独立性最高的是公用事业（ρ=0.59），
      但独立性 ≠ 值得配置（公用事业属脉冲象限）。
    confidence: medium          # n=9 期，相关系数噪声大，指示性
    status: open
    tags: [相关性, β与α, 分散度]
    evidence: research/P06-sector-momentum-20261030/artifacts/sector_monthly/industry_sentiment_2026_v2.html
    data: research/P06-sector-momentum-20261030/artifacts/sector_monthly/analysis_v2.json

  - id: C-P06-05
    statement: >
      双低象限（规避）4 个：电子（资金 -253 亿、近 3 月 -17.5%、振幅 89）、
      通信（-89 亿 / -20.1%）、有色金属（-10 亿 / -15.7%）、计算机（-10 亿 / -11.1%）。
      资金与趋势双负，无反转证据。
    confidence: medium
    status: open
    tags: [行业景气, TMT, 双低]
    evidence: research/P06-sector-momentum-20261030/artifacts/sector_monthly/industry_sentiment_2026_v2.html
    data: research/P06-sector-momentum-20261030/artifacts/sector_monthly/analysis_v2.json
    counter_arguments:
      - "电子 YTD -1.8% 但振幅 89 —— 深跌后可能存在超跌反弹的技术性机会（本方法不做择时，无法判定）。"

  - id: C-P06-06
    statement: >
      全年呈极端 K 型分化：煤炭 YTD +21.8% vs 电力设备 -30.0%，首尾价差 51.8 个百分点；
      红利防御（煤炭 / 石油石化 / 银行）与前期高估 TMT（通信 / 计算机 / 电子）走势背离。
    confidence: high
    status: open
    tags: [行业景气, K型分化, YTD]
    evidence: research/P06-sector-momentum-20261030/artifacts/sector_monthly/industry_sentiment_2026_v2.html
    data: research/P06-sector-momentum-20261030/artifacts/sector_monthly/analysis_v2.json


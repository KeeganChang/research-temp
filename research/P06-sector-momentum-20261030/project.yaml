# P06 · 2026-10-30 A股行业景气度横截面跟踪（method-sector-momentum 首个案例）
#
# 行业层横截面监测：资金面（当期主力净流入）× 价格景气（近 12 个月月度环比）双维度交叉。
# 停在行业层，交付「景气图谱 + 四象限 + 行业短名单」；不下钻个股。
# 若需下钻标的：本项目的行业短名单 → 新建子 task 走 method-topdown 的 A3。
#
# 目录命名：`P<编号>-<slug>-<YYYYMMDD>`（周期性观察类项目带日期，便于按次重跑归档）。

id: P06
name: "2026-10-30 A股行业景气度横截面跟踪"
track: drill                  # 5 Track 体系：从申万行业全集里选最优子集
method: method-sector-momentum
status: active
created_at: 2026-10-30
updated_at: 2026-10-30

question: >
  近一周资金净流入 Top10 的行业有哪些？近一年（截至 2026-10）月度景气度如何演化？
  资金流方向与景气动量是否同向 —— 哪些是真趋势、哪些只是事件脉冲或避险承接？

scope_in:
  - 12 个申万一级行业的月度景气时序（2025-12-31 → 2026-10-29，10 个月末观测点）
  - 2026-10-29 单日主力资金流横截面（流入 Top + 流出侧对照 + 概念层佐证）
  - 资金流 × 景气动量 四象限交叉归类
  - 同涨同跌（β）与独立性（α）检验：月度环比相关系数矩阵

scope_out:
  - 不下钻个股标的（如需，转 method-topdown A3，建子 task）
  - 不覆盖全部 31 个申万一级行业（本次 12 个代表行业）
  - 不做基本面景气（盈利 / 订单 / 产能）——景气度以**价格**为代理，须显式声明
  - 不做择时与仓位建议

deliverables:
  - "景气度矩阵 + 四象限散点 + 相关矩阵热力图（industry_sentiment_2026_v2.html）"
  - "景气度走势折线图（横轴相对月份 × 纵轴景气度，12 行业，含归一化/环比双模式）"
  - "行业层主推短名单 + 失效触发条件"

skills: [research-core, research-track-drill, method-sector-momentum]
owner: "拿铁"

# 本项目踩坑换来的硬规矩（跨项目可复用的应提升进 research/_shared/）
notes: >
  ① 板块资金主力统计是**日频 T+1、无原生周度聚合** —— "近一周"默认给最新交易日快照并明示口径；
     严格 N 日累计须逐日拉取求和。
  ② **大跌日修正（本项目最重要发现）**：2026-10-29 全市场超 4700 只个股下跌，
     当日资金流被**避险属性**主导，"脉冲"象限会系统性虚高（国防军工资金第 1 但近 3 月 -4.8%）。
     → 做 M4 前必须先记录当日大盘状态（涨跌家数 / 指数 / 成交额），解读时扣除避险成分。
  ③ 接口省略 2026-01 月末 → 时序第 2 段为「2025-12-31 → 2026-02-27」跨 2 月累计，须标注。
  ④ 资金流数值分「逾 X 亿」（精确下限）与「超 X 亿」（仅知 >X）两种，后者标 lower_bound，
     **不可与前者同权排序**。
  ⑤ 景气度以价格为代理，**不等于基本面景气**；叙述性结论必须由数据脚本生成或校验
     （v1 曾手写"红利正收益"与计算值 -10.7% 矛盾）。
  ⑥ 象限可为空（本项目"未兑现"为 0），不得为凑数强行归类。

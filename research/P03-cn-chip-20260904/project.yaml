# 驱动问题：这个项目最终要回答的那一个问题（必须可判定）
question: >
  芯片全价值链（设计/EDA → 制造/IDM → 设备 → 材料 → 封测/先进封装 → 存储）在 2026 超级周期下的
  业绩兑现是否分层？哪一层已真兑现、哪一层还在讲故事、哪一层是卡脖子？
  国产替代的真实水位与天花板在哪？由此给出研究优先级短名单与反噬预警。

# 边界：写清楚"不做什么"比写"做什么"更能防跑偏
scope_in:
  - A股 + 全球芯片价值链六环节（设计/EDA、制造/晶圆代工、设备、材料、封测/先进封装、存储）
  - 以 2026H1 中报为兑现度主证据，结合资本开支 / 产能 / 国产化率
  - 与 P01（半导体/AI 算力链切片）互补：P01 聚焦 AI 算力链切片，本项覆盖完整价值链并强化"国产化水位 + 卡脖子"维度
scope_out:
  - 纯海外非上市/境外上市巨头（英伟达 / 台积电 / 三星）的逐季财务不展开，仅作对标
  - 不做技术路线预测（GAA vs FinFET、HBM4 规格等）
  - 不涉及资讯域日频（归 lark base，独立管线）

# 交付物：项目结束时应该有哪几份东西
deliverables:
  - 芯片行业六段式深度报告（archive/raw/行业/）
  - 兑现度矩阵 + 国产化三级梯队
  - 研究优先级短名单（含暂不列入及理由）
  - 反噬预警监控表（monitors）

skills: [research-core, research-track-drill, method-topdown]

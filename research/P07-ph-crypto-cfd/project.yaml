# 驱动问题（可判定、可证伪）
question: >
  以参与菲律宾监管沙盒为前提的合规 CFD 业务，能否在菲律宾合法开展并规模化？
  具体回答四问：① 零售 CFD 的法定地位，以及沙盒/牌照的准入条件、时点、主体资格；
  ② 钱包支付入金链路（电子钱包 / 银行转账 / 现金柜台 / 稳定币）的可行性与成本；
  ③ 与持牌 VASP、电子钱包、银行、汇款商的可行合作方式；
  ④ 机会区 / 禁区 / 观察哨清单。
  证伪条件：若零售 CFD 被明令禁止、或沙盒不覆盖该类业务，则「能否进入」判否，
  改答 E3「需求重定向的承接方」与替代合规路径。

scope_in:
  - 菲律宾宏观与 PEST：GDP / 人均 / 通胀 / 汇率 / 利率 / 人口与收入结构 / 消费占比 / 海外劳工汇款
  - 监管与准入：BSP VASP·CASP 牌照与监管沙盒机制、SEC 规则、AMLC 反洗钱；零售 CFD 与衍生品法定地位；监管三档（已生效 / 待生效 / 悬而未决）分开写
  - 支付与入金：GCash / Maya / InstaPay / PESONet / 银行转账 / 现金柜台 / 稳定币入金的链路、成本、合规约束
  - 用户画像：一般用户 + 金融用户双层；社会、文化、娱乐休闲、支付方式、投资习惯；渗透拆「客单价 × 频次」
  - 竞品：泛金融机构 + Crypto 合规（持牌）企业对比；商业模式 / 份额 / 护城河 / 同口径财务对照
  - E3 相邻·替代：受限或被禁品类的需求重定向承接方、合规溢价与定价权
  - 合作方式：白标 / 牌照借用 / 合资 / 渠道分销 / 技术输出 / 清算与流动性合作
  - 市场措施：分阶段进入路径 + 机会区 / 禁区 / 观察哨
  - 时效：2025–2026 为主，优先采用已发布的最新版报告（含 2027 edition / 2027 展望），监管状态追至最新可得时点

scope_out:
  - 不做币价预测、链上技术分析、不评代币基本面
  - 不做交易策略与杠杆参数设计，不提供投资建议
  - 不覆盖菲律宾以外司法辖区的完整进入分析（仅作对照时可引用，不展开）
  - 不研究如何规避监管；未注册 / 离岸平台仅作为需求重定向与合规对照对象
  - 不做完整财务建模 / 估值模型；玩家对照只做同口径对照表
  - 不建独立证据层 / unit 文件（RUtable 已废止，数据唯一归属地 = 报告本身）

deliverables:
  - 自包含单页 HTML 研究报告（优先载体）+ markdown 源
  - 机会区 / 禁区 / 观察哨清单
  - 玩家地图（份额 + 护城河 + 商业模式）+ 合规企业同口径财务对照表
  - 钱包支付入金链路图 + 合作方式备选清单（含被否决备选，判断类结论标 kind: judgment）
  - 口径块 + 内联引用 Reference + 反方 ≥5 条（含 ≥1 条时间维度）


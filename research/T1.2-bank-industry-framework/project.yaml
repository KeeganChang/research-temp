# 驱动问题（可判定）
question: >
  在 2026 年「低利率 + 信贷降速提质 + 监管反内卷/化债」的三重约束下，中国银行业的钱到底从哪赚、
  利润结构正在怎样迁移、以及哪一类玩家在这场迁移中占优？

# 边界
scope_in:
  - "中国 A 股上市银行 42 家（国有大行 6 / 股份行 9 / 城商行 17 / 农商行 10），行业层分析"
  - "宏观背景：GDP / 社融 / 信贷结构 / 利率与货币政策 / 监管取向"
  - "业务逻辑：负债端—资产端—中收—成本与资本 四段拆解（银行的「资产负债表生意」本质）"
  - "竞品分析：类型梯队竞争 + 业务赛道竞争（对公 / 零售 / 财富 / 小微）+ 跨界玩家"
scope_out:
  - "不做个股财务建模与目标价（属 A3；T1.1 已完成杭州银行）"
  - "不覆盖非银金融机构（保险 / 券商 / 信托）"
  - "不做宏观预测与 GDP 路径推演（只引用权威机构已发布判断，不自行建模）"
  - "不重复 T1 已完成的板块行情、主推归因、ROE 排名（直接引用 T1 结论）"

# 交付物
deliverables:
  - "银行行业框架报告：宏观背景 / 业务逻辑 / 竞品分析 三段（含 6 张对照表）"
  - "关键指标监控表（NIM / 不良 / 中收 / 大行下沉价差），带告警阈值"
  - "竞争格局分层表 + 五类玩家对比"

skills: [research-core, method-topdown]
owner: "拿铁（Latte）"

notes: >
  口径坑（必须双列，不可混用）：
  ① 净息差有两个口径——金融监管总局「商业银行整体」2026Q2 = 1.41%；中金测算「上市银行」
     2026 前三季度 = 1.31%。本报告并列展示，不合成单一数字。
  ② 中收占比有两个算法——WIND「42 家合计口径」13.18%；国信「上市银行平均水平」约 9%，
     差异源于是否含其他非息与样本范围。
  ③ 收入结构表为「占营收比」三分项（利息净收入 / 手续费净收入 / 其他非息），三项和 ≈100%，
     与「中收占比」不是同一指标。
  数据源等级：公开媒体引述监管数据/半年报/三季报/券商研报，Tier-2/3；生产级数字回 NeoData/Wind 复核。

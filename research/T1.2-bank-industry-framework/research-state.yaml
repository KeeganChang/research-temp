# ── 当前研究焦点 ──────────────────────────────────────────────
focus:
  topic: "银行行业框架：宏观约束 / 赚钱机制 / 竞争格局（补 T1 未覆盖的三块）"
  type: 行业
  status: done                 # active | paused | done（本轮已交付，转后续监控）
  started_at: 2026-11-03
  rationale: "T1 回答了「为何主推、选谁」，但缺行业机制层——宏观怎么约束、钱怎么赚、谁在赢。补齐后才能判断 T1 主推逻辑的可持续性，并为剩余短名单个股下钻提供筛选框架。"

# ── 结论台账 ──────────────────────────────────────────────────
claims:
  - id: C-T1.2-01
    statement: >
      2026 年银行面临「价被压、量受限、险在升」三重同时收紧的结构性约束：净息差 1.41% 较监管合意
      1.8% 低 39bp；贷款余额增速仅 5.2%（M2 +8.0%）且扩表受核心一级资本 10.54% 硬约束；
      住户贷款前三季度净减 1.03 万亿、零售不良升至 1.76%。这不是周期波动，是长期态。
    confidence: high
    status: validated
    tags: [宏观约束, 低利率, 信贷降速提质, 结构性]
    evidence: research/T1.2-bank-industry-framework/T1.2-LarkDoc-主交付.md
    data: research/T1.2-bank-industry-framework/artifacts/search_returns.md#检索-2
    derived_from:
      project: T1
      claim: C-T1-01
    counter_arguments:
      - "若财政端大幅加力（特别国债/政策性金融工具）带动企业中长贷重新放量，量受限的前提会被打破。"
      - "若居民风险偏好回升推动存款活化（活期占比上升），负债成本改善幅度会超预期。"
      - "住户贷款净减少可能包含提前还贷集中释放的阶段性因素，不等同长期去杠杆。"
      - "资本约束对大行不成立（建行核心一级 14.39%），约束只对中小行硬。"
      - "【时间维度】宏观约束的松紧取决于「十五五」开局年政策力度，2027 年财政节奏变化可能改写判断。"

  - id: C-T1.2-02
    statement: >
      2026Q2 净息差 1.41% 的 1BP 环比回升，动力来自负债端高息定存到期重定价（挂牌利率降幅超过
      LPR，且存款重定价滞后于贷款的时间差被追平），而非资产端改善。上市银行口径前三季度仅 1.31%
      （同比 -1bp）——是「企稳」不是「拐点」，红利边际递减。
    confidence: high
    status: validated
    tags: [净息差, 重定价红利, 负债成本, 口径冲突]
    evidence: research/T1.2-bank-industry-framework/T1.2-LarkDoc-主交付.md
    data: research/T1.2-bank-industry-framework/artifacts/search_returns.md#检索-1
    derived_from:
      project: T1
      claim: C-T1-01
    counter_arguments:
      - "1bp 在统计上可能只是噪声，不足以支撑「企稳」判断。"
      - "若资产端因反内卷整治而稳住定价，息差可能不只是企稳而是真实回升。"
      - "存款定期化使负债成本下降慢于预期，红利释放可能比测算更持久（反向风险）。"
      - "监管口径（全行业 1.41%）与上市银行口径（1.31%）差 10bp，说明非上市中小行更弱，行业均值掩盖尾部。"
      - "【时间维度】交行披露下半年重定价贡献仅「三成多」，2027 年红利耗尽后可能二次探底。"

  - id: C-T1.2-03
    statement: >
      2026H1 上市银行收入结构为利息净收入 70.78% / 中收 13.18% / 其他非息约 16%。中收占比不升反降、
      首次跌破 14%（去年同期 14%），且前三季度净手续费增速 -1.6%（2025 年来首次转负）——「财富管理
      第二曲线」在存款搬家最猛的年份仍未接住息差缺口。未来分化由非息能力而非息差决定。
    confidence: high
    status: validated
    tags: [收入结构, 中收, 财富管理, 第二曲线]
    evidence: research/T1.2-bank-industry-framework/T1.2-LarkDoc-主交付.md
    data: research/T1.2-bank-industry-framework/artifacts/search_returns.md#检索-3
    derived_from:
      project: T1
      claim: C-T1-02
    counter_arguments:
      - "中收占比下降部分源于分母（利息净收入）因规模扩张而变大，不代表中收绝对额下降。"
      - "其他非息（债市投资收益 +13.8%）已部分替代中收，只看手续费会低估非息转型进度。"
      - "中收口径含银行卡/结算等被费率下调挤压的传统项，剔除后财富类中收实际在增长（宁波 +53.9%）。"
      - "资本市场若在 2027 年走强，代销与资管收入可能集中释放，占比会快速回升。"
      - "【时间维度】财富管理是抗波动而非爆发式增长，用单年占比判断「接不住」可能过早。"

  - id: C-T1.2-04
    statement: >
      竞争格局已固化为「头部吃肉、腰部细分、尾部出清」：国有大行凭最低负债成本（普惠小微可报 3.0%）
      重新扩张份额；股份行被大行下沉与互联网夹击、ROE 均值 8.39% 垫底；城商行命运由区域 β 决定
      （长三角优、东北西北弱，行业不良 1.87% 高于均值）；农商行进入兼并重组常态化。
      大行与中小行 1.5pct 的小微利率差由负债成本决定，不可通过努力弥补。
    confidence: high
    status: validated
    tags: [竞争格局, 梯队固化, 大行下沉, 区域分化]
    evidence: research/T1.2-bank-industry-framework/T1.2-LarkDoc-主交付.md
    data: research/T1.2-bank-industry-framework/artifacts/search_returns.md#检索-6
    derived_from:
      project: T1
      claim: C-T1-03
    counter_arguments:
      - "利率差可通过差异化客群（大行做不了的复杂小微）部分规避，不是绝对宿命。"
      - "大行下沉受资本与风险成本约束，普惠不良破 5% 后可能主动收缩，给中小行留出空间。"
      - "区域 β 判断可能低估优质城商行的经营 α（杭州 ROE 17.74% 远超同区域同业）。"
      - "农商行兼并重组是政策推动，不必然意味着单体银行失去生存空间。"
      - "【时间维度】梯队固化是当前态，若利率市场化进一步深化或出现大规模风险事件，格局可能重排。"

  - id: C-T1.2-05
    statement: >
      银行利润表正从「存贷利差主导」转向「利差 + 中收 + 公允价值」三元结构。因此「选银行」的实质
      是三选三：选成本结构（负债端）、选区域（资产端 β）、选中收能力（客群质量）。这构成对 T1
      「银行为唯一主推」的条件性支持——主推可持续性取决于息差能否守住 1.4% 与中收能否接棒。
    confidence: medium
    status: open
    tags: [判断, 三元结构, 选股框架, 与T1衔接]
    evidence: research/T1.2-bank-industry-framework/T1.2-LarkDoc-主交付.md
    data: research/T1.2-bank-industry-framework/artifacts/search_returns.md
    derived_from:
      project: T1
      claim: C-T1-04
    next_action: Q-T1.2-02
    counter_arguments:
      - "「三元结构」是行业整体叙事，个体银行差异极大，用行业框架选个股可能失真。"
      - "公允价值收益波动极大且不可持续，把它列为结构之一可能高估其战略意义。"
      - "三选三框架未纳入估值维度，成本/区域/中收都好的银行可能已被充分定价（如招行）。"
      - "「守住 1.4%」缺乏理论依据，息差均衡水平取决于资产收益率与负债成本的动态，不是固定阈值。"
      - "【时间维度】若 2027 年降息落地，1.4% 大概率守不住，则本判断的前置条件失效。"

